name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Write project config
        run: |
          cat > package.json <<'JSON'
          {
            "name": "ict-macros",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.ictmacros.app",
            "appName": "ICT Macros",
            "webDir": "www"
          }
          JSON
          mkdir -p www
          cp ict-macros.html www/index.html

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = path.read_text(encoding='utf-8')
          for permission in ['android.permission.POST_NOTIFICATIONS', 'android.permission.VIBRATE']:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in manifest:
                  manifest = manifest.replace('<application', tag + '\n    <application', 1)
          if '<application' not in manifest:
              raise SystemExit('Tag application tidak ditemukan di AndroidManifest.xml')
          path.write_text(manifest, encoding='utf-8')
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Check APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          unzip -tq "$APK"

      - name: Pack APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/ICT-Macros.apk

      - name: Publish release with plain APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/ICT-Macros.apk \
            --title "ICT Macros build ${{ github.run_number }}" \
            --notes "APK debug. Unduh ICT-Macros.apk lalu instal." \
            --target "${{ github.sha }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ICT-Macros-APK
          path: out/ICT-Macros.apk
          if-no-files-found: error
          retention-days: 14
